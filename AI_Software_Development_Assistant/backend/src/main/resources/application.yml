
server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 15000
      maximum-pool-size: 5
      minimum-idle: 0

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:validate}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

app:
  jwt-secret: ${JWT_SECRET}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  ai-url: ${AI_SERVICE_URL:http://localhost:8000}
  ai-internal-key: ${AI_INTERNAL_KEY}
  mail-from: ${MAIL_FROM:}
